name: CI

# Checks on every pull request and on every push to main. The job name "Tests" is the status check required by the
# branch protection of main (ADR 0015). It runs the documentation checks and the offline addon tests
# (Tests/run_tests.py: Lua 5.1 through lupa on a mock client, ADR 0019).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Links, wiki sidebar and links, ADR index, privacy scan, LF line endings, the docs rule's own cases.
      - name: Check the documentation
        run: python -I -X utf8 tools/check_docs.py

      # The libraries are pinned in .pkgmeta and never committed; the tests load the real Ace3 and LibDBIcon from Libs/.
      - name: Run the addon tests
        run: |
          python -m pip install lupa==2.8
          python -I -X utf8 tools/fetch_libs.py
          python -I -X utf8 Tests/run_tests.py
