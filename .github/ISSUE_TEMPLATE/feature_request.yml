name: Feature request
description: Suggest a new feature or an improvement for Azeroth Guild Finder.
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome.
        **Privacy:** do not paste other players' names, whispers, chat logs, account names or folder paths from your PC.
        For an open conversation before writing a formal request, you can also start a topic in the [Feedback discussions](https://github.com/Finland6738/azeroth-guild-finder/discussions/categories/feedback).
  - type: dropdown
    id: who
    attributes:
      label: Who is it for?
      options:
        - Players looking for a guild
        - Guild Masters
        - Officers
        - Everyone
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: The situation in game where you missed it.
    validations:
      required: true
